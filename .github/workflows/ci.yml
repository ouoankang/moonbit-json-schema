# 持续集成：类型检查 + 单元测试 + 官方一致性套件。
#
# 三件事都跑，是因为它们各自能抓到不同的问题：
#   * `moon check` —— 任何目标上都该通过；库本体不依赖平台能力。
#   * `moon test`  —— 默认 wasm 目标，跑单元测试。
#   * 一致性套件   —— 走 js 后端（要读测试文件），给出必测通过率，
#                     必测不全会让这一步失败，从而挡住回归。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain versions
        run: |
          moon version --all
          node --version

      - name: Type check
        run: moon check

      - name: Unit tests
        run: moon test

      # 顺手校验生成物没有和脚本脱节：重跑两个生成器，再检查工作区是否被改动。
      # 表是逐码点从宿主运行时抽出来的，换 Node 大版本理论上可能产生 diff，
      # 所以这一步只做提示、不让它失败。
      - name: Regenerate derived tables
        run: |
          node scripts/gen-unicode-categories.mjs
          node scripts/gen-metaschema.mjs
          git diff --stat

      - name: Conformance suite (draft2020-12, required cases must be green)
        run: moon run --target js cmd/conformance

      - name: Smoke-test the CLI
        run: |
          moon run --target js cmd/main -- validate examples/person.schema.json examples/person.ok.json
          moon run --target js cmd/main -- lint examples/person.schema.json

      # ---------------------------------------------------------------------
      # 在线演示页那条链路。
      #
      # 单独验证是必要的：页面的入口是 MoonBit 的 js 后端 + FFI 挂载，
      # `moon test` 跑的是 wasm 上的库代码，完全覆盖不到。库测试全绿、
      # 页面白屏，是真实会发生的情况。
      # ---------------------------------------------------------------------

      - name: Check demo page wiring (no dependencies)
        run: node scripts/web-wiring-check.mjs

      # 产物是提交进仓库的（这样 clone 下来 web/index.html 双击就能开）。
      # 这里重新构建一遍看有没有脱节。和上面的生成物一样只做提示：
      # 换 MoonBit 版本后产物字节会变，不该因此判定 CI 失败。
      - name: Rebuild web bundle and show any drift
        run: |
          node scripts/build-web.mjs
          git diff --stat

      - name: Smoke-test the browser entry
        run: node scripts/web-smoke.mjs

      - name: Check demo examples still match real behaviour
        run: node scripts/web-examples-check.mjs

      - name: Render the demo page in jsdom (optional)
        run: |
          npm install --no-save jsdom || echo "jsdom 装不上，脚本会自行跳过"
          node scripts/web-render-check.mjs
